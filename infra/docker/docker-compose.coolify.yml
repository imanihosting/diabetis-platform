# The production stack, as one file, for Coolify.
#
# Coolify's UI takes a single compose path, so this is deliberately
# self-contained rather than `docker-compose.yml` plus the production overlay.
# The duplication is the price of that, and it is paid on purpose: a deployment
# somebody clicks "deploy" on should be readable in one file, not assembled in
# their head from two.
#
# **Every path here is relative to the repository root, not to this file.**
# Coolify runs compose with `--project-directory` set to the checkout root, and
# that is what relative build contexts and bind mounts resolve against — not
# the directory the compose file happens to live in. Written the other way,
# `context: ../../metabolic-engine` resolves to `/metabolic-engine` and the
# build fails with "unable to prepare context: path not found".
#
# To run it by hand, pass the same project directory:
#
#   docker compose -f infra/docker/docker-compose.coolify.yml \
#                  --project-directory . up -d --build
#
# Coolify settings that go with it:
#
#   Build Pack              Docker Compose      (not Dockerfile — this is four services)
#   Base Directory          /
#   Compose file            infra/docker/docker-compose.coolify.yml
#   Domain (frontend only)  https://wellovue.com
#
# Only `frontend` gets a domain. The backend and the engine are reached over
# the compose network and must never be routable from outside: the backend is
# the API and the engine has no authentication of its own beyond a service
# token.
#
# Nothing here publishes a port and nothing terminates TLS. Cloudflare does
# that at the edge, and the tunnel is the only ingress. See infra/README.md,
# "Going live".

name: wellovue

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000

      # --- The launch switches. -------------------------------------------
      # Set here rather than in Coolify's environment editor so they cannot be
      # forgotten on a redeploy or quietly turned off in a dashboard. With
      # PUBLIC_LAUNCH on, this container refuses to start while any launch
      # blocker is open, and says which.
      PUBLIC_LAUNCH: 'true'
      TRUST_PROXY: 'true'
      REQUIRE_VERIFIED_DB_TLS: 'true'
      REQUIRE_SHARED_RATE_LIMIT: 'true'
      DATABASE_SSL_REJECT_UNAUTHORIZED: 'true'

      # The header Cloudflare sets at the edge. The only client address that
      # can be trusted through a CDN that appends to X-Forwarded-For rather
      # than overwriting it — see the throttle guard, and infra/README.md.
      CLIENT_IP_HEADER: cf-connecting-ip

      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Coolify}
      DATABASE_CA_CERT: /etc/wellovue/db-ca.crt
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in Coolify}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PREFIX: ${S3_PREFIX:-diabetes-platform/}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in Coolify}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      METABOLIC_ENGINE_URL: http://metabolic-engine:8000
      METABOLIC_ENGINE_TOKEN: ${METABOLIC_ENGINE_TOKEN:?set METABOLIC_ENGINE_TOKEN in Coolify}
      NEXT_PUBLIC_APP_URL: https://wellovue.com
    volumes:
      - ./infra/db/ca.crt:/etc/wellovue/db-ca.crt:ro
    extra_hosts:
      # node-postgres only tells Node which host to verify when the host is not
      # an IP address, so verify-full is unreachable by address however the
      # certificate is written. This is what makes the name resolve.
      - 'medical-db:10.10.5.185'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  metabolic-engine:
    build:
      context: ./metabolic-engine
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in Coolify}
      METABOLIC_ENGINE_TOKEN: ${METABOLIC_ENGINE_TOKEN:?set METABOLIC_ENGINE_TOKEN in Coolify}
      ENVIRONMENT: production
      PGSSLROOTCERT: /etc/wellovue/db-ca.crt
    volumes:
      - ./infra/db/ca.crt:/etc/wellovue/db-ca.crt:ro
    extra_hosts:
      - 'medical-db:10.10.5.185'
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live').status==200 else 1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        # Build-time, both of them. Next inlines NEXT_PUBLIC_* during the
        # build, so the site URL ends up in every canonical link and in the
        # sitemap; and PUBLIC_LAUNCH makes the build fail while a legal
        # placeholder is still in a user-facing page. Putting either under
        # `environment:` would silently do nothing.
        NEXT_PUBLIC_SITE_URL: https://wellovue.com
        PUBLIC_LAUNCH: 'true'
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:4000
      # Coolify's proxy and Cloudflare own the forwarding headers before this
      # app is reached, so the /api proxy passes them through rather than
      # dropping them. Without this the chain breaks here and every request in
      # the deployment keys on one container.
      TRUST_PROXY: 'true'
    # The only service with a domain. Coolify routes to this port; nothing is
    # published to the host, because a published port would be a second way in
    # that skips Cloudflare and with it TLS, the WAF, and CF-Connecting-IP.
    expose:
      - '3000'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
