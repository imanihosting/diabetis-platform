# Runs the platform locally in containers, against the provisioned
# PostgreSQL and MinIO VMs.
#
#   npm run docker:up        build and start
#   npm run docker:logs
#   npm run docker:down
#
# For an isolated stack with its own throwaway database and object storage,
# use docker-compose.test.yml instead — see infra/README.md.
#
# **This file is for a developer's machine, not for a server.** Every published
# port below is bound to 127.0.0.1 for that reason: on a host with a public
# address, `"6379:6379"` listens on all of them, and an unauthenticated Redis
# holding session state would be reachable from the internet. So would the API
# and the engine, on a path that goes around Cloudflare and therefore around
# TLS, the WAF, and the header rate limiting depends on.
#
# The loopback prefix makes that mistake impossible rather than unlikely. To
# deploy, use docker-compose.coolify.yml, which publishes nothing at all.

name: wellovue

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
      # Explicit: the Dockerfile also defines a `test` stage, which would
      # otherwise be selected as the last stage in the file.
      target: runtime
    environment:
      NODE_ENV: production
      BACKEND_PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-false}
      # The internal CA that signed the database certificate, scoped to the
      # database pool rather than exported through NODE_EXTRA_CA_CERTS, which
      # would let it vouch for the engine and object storage too.
      DATABASE_CA_CERT: /etc/wellovue/db-ca.crt
      # Both refuse to start rather than run in the unsafe state. Safe to set
      # here because this file always provides Redis and the certificate above.
      REQUIRE_VERIFIED_DB_TLS: ${REQUIRE_VERIFIED_DB_TLS:-false}
      REQUIRE_SHARED_RATE_LIMIT: ${REQUIRE_SHARED_RATE_LIMIT:-false}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT in .env}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_PREFIX: ${S3_PREFIX:-diabetes-platform/}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      METABOLIC_ENGINE_URL: http://metabolic-engine:8000
      METABOLIC_ENGINE_TOKEN: ${METABOLIC_ENGINE_TOKEN}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Outbound mail. Off by default on a developer's machine, which is a real
      # operating mode rather than a broken one: the outbox row is still
      # written and marked `skipped`, so the flow is visible without a tenant.
      # Set MAIL_ENABLED=true with MAIL_DRY_RUN=true to exercise the whole path
      # and read the verification link out of the container logs.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_DRY_RUN: ${MAIL_DRY_RUN:-true}
      GRAPH_TENANT_ID: ${GRAPH_TENANT_ID:-}
      GRAPH_CLIENT_ID: ${GRAPH_CLIENT_ID:-}
      GRAPH_CLIENT_SECRET: ${GRAPH_CLIENT_SECRET:-}
      GRAPH_SENDER_USER: ${GRAPH_SENDER_USER:-}
      GRAPH_BASE_URL: ${GRAPH_BASE_URL:-https://graph.microsoft.com/v1.0}
      MAIL_SUPPORT_EMAIL: ${MAIL_SUPPORT_EMAIL:-support@wellovue.com}
      # Where verification and reset links point. Read at runtime by the
      # backend, unlike NEXT_PUBLIC_SITE_URL which the frontend bakes in at
      # build time — a link generated against the wrong host is an account
      # nobody can activate.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "127.0.0.1:4000:4000"
    # The trust anchor is baked into the image rather than mounted. It used to
    # be a bind mount, which is fine on a machine where the checkout stays put
    # and fatal on a platform that builds in a temporary directory and deletes
    # it — Docker replaces the missing source with an empty directory and the
    # process exits on EISDIR. Baked, both cases behave the same.
    extra_hosts:
      # The certificate is issued for this name. node-postgres only tells Node
      # which host to verify when the host is not an IP address (see
      # pg/lib/connection.js), so connecting by address cannot reach
      # verify-full however the certificate is written.
      - "medical-db:10.10.5.185"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  metabolic-engine:
    build:
      context: ../../metabolic-engine
      dockerfile: Dockerfile
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      METABOLIC_ENGINE_TOKEN: ${METABOLIC_ENGINE_TOKEN}
      ENVIRONMENT: production
      # libpq's own variable, so `sslmode=verify-full` in the shared
      # DATABASE_URL resolves against the internal CA here too. psycopg reads
      # it without the engine needing to know the URL was written for two
      # different drivers.
      PGSSLROOTCERT: /etc/wellovue/db-ca.crt
    extra_hosts:
      - "medical-db:10.10.5.185"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      target: runtime
      args:
        # Build-time, not run-time: Next inlines NEXT_PUBLIC_* during the
        # build, and this one ends up in every canonical URL and in the
        # sitemap. Putting it under `environment:` would silently do nothing.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      # The browser talks to a same-origin /api that Next rewrites here.
      BACKEND_URL: http://backend:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis-data:
