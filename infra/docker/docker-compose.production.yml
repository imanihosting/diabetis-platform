# The production overlay: Coolify behind a Cloudflare Tunnel.
#
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Coolify builds and runs these images and puts its own reverse proxy in front;
# `cloudflared` dials out to Cloudflare and is the only ingress. Nothing here
# terminates TLS and nothing here binds a public port, which is the point of
# the arrangement: there is no inbound listener to find.
#
# An earlier version of this file ran Caddy for TLS. That was right for a host
# with public ports and wrong here twice over — it would fight Coolify's proxy
# for 80 and 443, and its ACME challenge needs inbound port 80, which a tunnel
# deliberately does not provide.
#
# `PUBLIC_LAUNCH=true` is the switch that makes every launch blocker fatal: the
# backend refuses to start while any is unresolved and the frontend image
# refuses to build while a legal placeholder is still in a user-facing page.

services:
  frontend:
    build:
      args:
        # Baked in at build time — canonical URLs, Open Graph, robots.txt and
        # the sitemap all carry it. See frontend/src/lib/seo.ts.
        NEXT_PUBLIC_SITE_URL: https://wellovue.com
        PUBLIC_LAUNCH: 'true'
    environment:
      # Cloudflare and Coolify's proxy own the forwarding headers before this
      # app is reached, so the Next proxy passes them through instead of
      # dropping them. Without this the chain breaks here and the backend keys
      # every request in the deployment on one container.
      TRUST_PROXY: 'true'
    # Published on the host's LAN address, and only that one.
    #
    # `cloudflared` reaches origins by the host's address —
    # `http://10.10.9.208:3000` — not over loopback, so a socket bound to
    # 127.0.0.1 refuses those connections even from this same machine. That was
    # tried and is why the tunnel could not reach the service.
    #
    # The interface is named rather than left as 0.0.0.0. Unqualified, Docker
    # would also listen on every bridge gateway on this host — 10.0.0.1,
    # 10.0.1.1, 10.0.2.1 — which every container in every other project on the
    # box can reach, and on any public interface the host is ever given. Naming
    # it keeps the surface to the one address the tunnel actually uses.
    #
    # It is host-specific, and deliberately so: moved to another server this
    # fails to bind at startup with the address in the error, which is a better
    # way to find out than discovering the port answering somewhere unintended.
    ports: !override
      - '10.10.9.208:3000:3000'

  backend:
    environment:
      PUBLIC_LAUNCH: 'true'
      TRUST_PROXY: 'true'
      # The header Cloudflare sets at the edge, and the only address that can
      # be trusted through a CDN that appends to X-Forwarded-For rather than
      # overwriting it. Without this every caller shares one rate-limit bucket;
      # with the wrong thing — the leftmost X-Forwarded-For entry — a caller
      # picks their own. See backend/src/common/guards/throttle.guard.ts.
      CLIENT_IP_HEADER: cf-connecting-ip
      REQUIRE_VERIFIED_DB_TLS: 'true'
      REQUIRE_SHARED_RATE_LIMIT: 'true'
      DATABASE_SSL_REJECT_UNAUTHORIZED: 'true'
      NEXT_PUBLIC_APP_URL: https://wellovue.com
    expose:
      - '4000'
    ports: !reset []
