[project]
name = "metabolic-engine"
version = "0.1.0"
description = "Metabolic intelligence service — pattern detection, prediction, causal analysis."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "psycopg[binary,pool]>=3.2.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    # Without these, strict mode reports every pandas/scipy call as untyped.
    "pandas-stubs>=2.2.0",
    "scipy-stubs>=1.14.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# Matches the runtime in metabolic-engine/Dockerfile.
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
# pandas-stubs types DataFrame operations loosely: most element access and
# arithmetic returns Any, so strict mode flags otherwise-correct code. The
# engines are covered by tests that assert on real numbers instead.
module = "app.engines.*"
disallow_any_expr = false
warn_return_any = false
